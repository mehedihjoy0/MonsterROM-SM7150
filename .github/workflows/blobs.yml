name: Update prebuilt blobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.audit.outputs.matrix }}
      has_updates: ${{ steps.audit.outputs.has_updates }}
      update_count: ${{ steps.audit.outputs.update_count }}
      blocked_count: ${{ steps.audit.outputs.blocked_count }}
      error_count: ${{ steps.audit.outputs.error_count }}
      attention_count: ${{ steps.audit.outputs.attention_count }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test prebuilt audit helpers
        run: |
          python3 -m unittest discover -s scripts/internal/tests -p 'test_*.py' -v
          bash scripts/internal/tests/test_prebuilt_utils.sh

      - name: Audit Samsung firmware feeds
        id: audit
        run: |
          python3 scripts/internal/check_prebuilt_updates.py \
            --github-output "$GITHUB_OUTPUT" \
            --markdown-summary "$GITHUB_STEP_SUMMARY"

  update:
    name: Update ${{ matrix.module }}
    needs: audit
    if: ${{ needs.audit.outputs.has_updates == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.audit.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh a52sxq
          ./scripts/build_dependencies.sh

      - name: Update prebuilt blobs
        env:
          DEVICE: ${{ matrix.device }}
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          source ./buildenv.sh a52sxq
          ./scripts/internal/update_prebuilt_blobs.sh "$DEVICE" "$FIRMWARE"
          PDA_BUILD="$(cut -d / -f 1 "./prebuilts/samsung/$DEVICE/.current")"
          printf 'PDA_BUILD=%s\n' "$PDA_BUILD" >> "$GITHUB_ENV"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: |
            prebuilts/samsung/${{ matrix.device }}
          commit-message: 'prebuilts/samsung/${{ matrix.device }}: update blobs to ${{ env.PDA_BUILD }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'prebuilts/samsung/${{ matrix.device }}'
          delete-branch: true
          draft: true
          title: 'Update prebuilts/samsung/${{ matrix.device }} blobs to ${{ env.PDA_BUILD }}'
          body: |
            Samsung FOTA audit found a newer stable firmware:

            - Current: `${{ matrix.current }}`
            - Latest: `${{ matrix.latest }}`
            - Android: `${{ matrix.android_version }}`
            - Compatibility boundary: `${{ matrix.compatibility_boundary || 'none' }}`
            - Source note: `${{ matrix.note || 'none' }}`

            Compatibility review is required. This job replaces only blob paths
            already present in the prebuilt directory; it does not update the
            qssi/essi system-image donor or make the complete ROM One UI 8.5.
